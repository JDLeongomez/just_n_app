<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="app-version" content="20260429174858" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just-N Framework: Aplicación Interactiva</title>
    <link rel="icon" type="image/svg+xml" href="just-n-logo.svg" />
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
    <script>
      (function() {
        var v = document.querySelector('meta[name="app-version"]').getAttribute('content');
        if (localStorage.getItem('swVersion') !== v) {
          localStorage.setItem('swVersion', v);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(rs) {
              if (rs.length > 0) {
                rs.forEach(function(r) { r.unregister(); });
                location.reload();
              }
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
